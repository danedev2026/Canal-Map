<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canal Map — live map | UK Waterways</title>
<meta name="description" content="Explore the UK's connected canals and navigable rivers on desktop: locks, facilities, moorings, place names and live stoppages.">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  :root { --green:#16302b; --gold:#d9a62a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  #map { position:absolute; inset:0; }
  .topbar { position:absolute; z-index:5; top:0; left:0; right:0; height:52px;
    background:var(--green); color:#fff; display:flex; align-items:center; gap:12px;
    padding:0 14px; box-shadow:0 1px 6px rgba(0,0,0,.3); }
  .topbar .mark { color:var(--gold); font-size:22px; }
  .topbar b { font-size:16px; }
  .topbar .sub { opacity:.7; font-size:12px; letter-spacing:.3px; }
  .topbar .spacer { margin-left:auto; }
  .topbar a.about { color:#cfe0dc; font-size:14px; text-decoration:none;
    display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .topbar a.about:hover { color:#fff; text-decoration:underline; }
  .topbar a.about .material-icons { font-size:18px; }
  .tbtn { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.12);
    color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:20px;
    padding:6px 12px; font-size:13px; cursor:pointer; }
  .tbtn:hover { background:rgba(255,255,255,.2); }
  .tbtn.on { background:var(--gold); color:#2a2205; border-color:var(--gold); }
  .tbtn .material-icons { font-size:17px; }
  /* Routing panel (top-centre, below the bar). */
  .rpanel { position:absolute; z-index:5; top:64px; left:50%; transform:translateX(-50%);
    background:#fff; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.25);
    padding:10px 14px; font-size:14px; display:none; align-items:center;
    gap:12px; row-gap:8px; flex-wrap:wrap; max-width:92vw; }
  .rpanel.show { display:flex; }
  .rpanel .stat b { font-size:16px; }
  .rpanel .stat span { color:#789; font-size:12px; margin-left:4px; }
  .rpanel .msg { color:#555; }
  .rpanel .err { color:#c0392b; }
  .rpanel button { background:var(--green); color:#fff; border:0; border-radius:16px;
    padding:6px 12px; font-size:13px; cursor:pointer; }
  .rpanel button.ghost { background:#eef1f0; color:#333; }
  .rpanel a.dl { color:#2a6fb0; font-size:13px; text-decoration:none; cursor:pointer; }
  .rpanel .hpd { font-size:13px; color:#555; display:flex; align-items:center; gap:5px; }
  .rpanel .hpd input { width:46px; padding:3px 5px; border:1px solid #ccc;
    border-radius:6px; font-size:13px; }
  #search { position:absolute; z-index:5; top:64px; left:12px; width:280px; max-width:70vw; }
  #search input { width:100%; padding:10px 12px; border:1px solid #ccc; border-radius:8px;
    font-size:14px; box-shadow:0 1px 6px rgba(0,0,0,.15); }
  #results { list-style:none; margin:4px 0 0; padding:0; background:#fff; border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.2); max-height:44vh; overflow:auto; display:none; }
  #results li { padding:9px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0; font-size:14px; }
  #results li:hover { background:#f4f7f6; }
  #results li small { color:#789; }
  .legend { position:absolute; z-index:5; bottom:64px; left:12px; background:#fff;
    border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.2); padding:10px 12px; font-size:13px; }
  .legend summary { font-size:12px; color:#555; text-transform:uppercase; letter-spacing:.4px;
    font-weight:600; cursor:pointer; list-style:none; }
  .legend summary::-webkit-details-marker { display:none; }
  .legend[open] summary { margin-bottom:6px; }
  .legend .row { display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; }
  .legend .row input { margin:0; accent-color:var(--green); }
  .legend .material-icons { font-size:17px; }
  .maplibregl-popup-content { font-size:14px; }
  .maplibregl-popup-content b { display:block; margin-bottom:2px; }
  /* Keep the map's own controls clear of the fixed top bar and the corner cards. */
  .maplibregl-ctrl-top-right { top:60px; }
  .maplibregl-ctrl-bottom-left { bottom:6px; }
  .banner { position:absolute; z-index:5; bottom:12px; left:50%; transform:translateX(-50%);
    background:#fff; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.2);
    padding:8px 12px; font-size:13px; color:#c0392b; white-space:nowrap; }

  /* Phones: compact the top bar to icons, free up the map, stop the squishing. */
  @media (max-width: 640px) {
    .topbar { gap:8px; padding:0 10px; }
    .topbar .sub { display:none; }
    .tbtn .label, .about .label { display:none; }
    .tbtn { padding:6px 9px; }
    #search { width:auto; left:12px; right:12px; }
    body.routing #search { display:none; } /* route panel takes the top slot */
    .rpanel { left:12px; right:12px; transform:none; max-width:none;
      flex-wrap:wrap; row-gap:8px; justify-content:center; }
    .legend { bottom:58px; font-size:12px; padding:8px 10px; }
    .banner { font-size:12px; bottom:10px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <span class="mark">⚓</span>
  <div><b>Canal Map</b> <span class="sub">UK WATERWAYS</span></div>
  <span class="spacer"></span>
  <button id="route" class="tbtn" title="Plan a route">
    <span class="material-icons">directions_boat</span><span class="label">Route</span>
  </button>
  <button id="sat" class="tbtn" title="Toggle aerial imagery">
    <span class="material-icons">satellite</span><span class="label">Satellite</span>
  </button>
  <a class="about" href="index.html" title="About &amp; download">
    <span class="material-icons">arrow_back</span><span class="label">About &amp; download</span>
  </a>
</div>

<div class="rpanel" id="rpanel"></div>

<div id="search">
  <input id="q" type="text" placeholder="Search places &amp; waterways…" autocomplete="off">
  <ul id="results"></ul>
</div>

<details class="legend" id="legend" open>
  <summary>Facilities</summary>
  <div id="legend-rows"></div>
</details>
<div class="banner" id="banner" style="display:none"></div>
<div id="map"></div>

<script>
// Facility types — label, colour and Material-icon glyph, matched to the app so
// the two feel like one product. (Glyphs are Material Icons ligature names.)
const POI = {
  lock:        ['Lock', '#37474F', 'gate'], // charcoal + lock-gate chevrons (not a red padlock)
  water_point: ['Water point', '#2980B9', 'water_drop'],
  sanitary:    ['Elsan / sanitary', '#27AE60', 'wc'],
  pumpout:     ['Pump-out', '#8E44AD', 'plumbing'],
  refuse:      ['Refuse disposal', '#7F8C8D', 'delete'],
  pub:         ['Pub', '#E67E22', 'sports_bar'],
  mooring:     ['Mooring', '#00897B', 'anchor'],
};
const STOP = { closed: '#D32F2F', restricted: '#F9A825', advisory: '#1976D2' };

const STOPPAGES_URL =
  'https://raw.githubusercontent.com/danedev2026/Canal-Map/main/data/stoppages.json';
const SEARCH_URL =
  'https://raw.githubusercontent.com/danedev2026/Canal-Map/main/data/search_index.json';

// Small icon for the legend/UI, matching the map: a Material glyph, or the
// custom lock-gate chevrons (the app-icon motif) drawn as inline SVG.
function legendIcon(glyph, color) {
  if (glyph === 'gate') {
    return `<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" ` +
      `style="vertical-align:middle"><g fill="none" stroke="${color}" ` +
      `stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">` +
      `<polyline points="6,12.5 12,7.5 18,12.5"/>` +
      `<polyline points="6,17 12,12 18,17"/></g></svg>`;
  }
  return `<span class="material-icons" style="color:${color}">${glyph}</span>`;
}

// The facilities legend doubles as show/hide toggles: untick a type to remove it.
const hiddenTypes = new Set();
const legendRows = document.getElementById('legend-rows');
for (const k in POI) {
  const row = document.createElement('label');
  row.className = 'row';
  row.innerHTML =
    `<input type="checkbox" checked data-type="${k}">` +
    legendIcon(POI[k][2], POI[k][1]) + `<span>${POI[k][0]}</span>`;
  legendRows.appendChild(row);
}
legendRows.addEventListener('change', (e) => {
  const t = e.target && e.target.getAttribute('data-type');
  if (!t) return;
  if (e.target.checked) hiddenTypes.delete(t); else hiddenTypes.add(t);
  applyFeatureFilter();
});

function applyFeatureFilter() {
  if (!map.getLayer('features')) return;
  const base = ['!=', ['get', 'type'], 'bridge'];
  map.setFilter('features', hiddenTypes.size
    ? ['all', base, ['!', ['in', ['get', 'type'], ['literal', [...hiddenTypes]]]]]
    : base);
}

// A rendered marker: a white disc + coloured ring + a centred Material glyph —
// exactly how the app draws its POI/stoppage icons (see _renderIcon in the app).
function markerImage(glyph, color, px = 88) {
  const cvs = document.createElement('canvas');
  cvs.width = px; cvs.height = px;
  const ctx = cvs.getContext('2d');
  const c = px / 2;
  ctx.beginPath();
  ctx.arc(c, c, c - 4, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.lineWidth = px * 0.06;
  ctx.strokeStyle = color;
  ctx.stroke();
  if (glyph === 'gate') {
    // Canal lock: two gate chevrons (the motif from the app icon). Reads as a
    // lock, not a padlock; neutral charcoal keeps it clear of the red alerts.
    ctx.strokeStyle = color;
    ctx.lineWidth = px * 0.075;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const w = px * 0.22, h = px * 0.12;
    for (const cy of [c - px * 0.10, c + px * 0.14]) {
      ctx.beginPath();
      ctx.moveTo(c - w, cy + h);
      ctx.lineTo(c, cy - h);
      ctx.lineTo(c + w, cy + h);
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = color;
    ctx.font = `${px * 0.5}px "Material Icons"`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(glyph, c, c);
  }
  return ctx.getImageData(0, 0, px, px);
}

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

const map = new maplibregl.Map({
  container: 'map',
  attributionControl: false, // added compact below so it doesn't sprawl
  center: [-1.90, 52.48], // Birmingham — the canal heartland
  zoom: 8,
  maxZoom: 16,
  style: {
    version: 8,
    glyphs: 'glyphs/{fontstack}/{range}.pbf',
    sources: {
      canal: {
        type: 'vector',
        url: 'pmtiles://basemap.pmtiles',
        attribution:
          '© OpenStreetMap contributors (ODbL); Canal &amp; River Trust; Environment Agency',
      },
      // Optional aerial imagery — free, no key (same source as the app).
      satellite: {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256, maxzoom: 19,
        attribution: 'Imagery © Esri, Maxar, Earthstar Geographics',
      },
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#eef3f6' } },
      // Imagery sits beneath the network so canals + icons stay on top; hidden
      // until the user turns it on.
      { id: 'satellite', type: 'raster', source: 'satellite', layout: { visibility: 'none' } },
      {
        id: 'waterway', type: 'line', source: 'canal', 'source-layer': 'network',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': ['match', ['get', 'waterway'], 'canal', '#2a6fb0', 'river', '#3a8fd0', '#3a8fd0'],
          'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.6, 11, 1.8, 16, 4.5],
        },
      },
      {
        id: 'tidal', type: 'line', source: 'canal', 'source-layer': 'network',
        filter: ['==', ['get', 'tidal'], 1],
        paint: {
          'line-color': '#e65100',
          'line-width': ['interpolate', ['linear'], ['zoom'], 6, 1.0, 11, 2.6, 16, 6.0],
          'line-dasharray': [2, 2],
        },
      },
      {
        id: 'places', type: 'symbol', source: 'canal', 'source-layer': 'places', minzoom: 8,
        filter: ['step', ['zoom'], ['match', ['get', 'type'], ['city', 'town'], true, false], 11, true],
        layout: {
          'text-field': ['get', 'name'], 'text-font': ['OpenSans-Regular'],
          'text-size': ['match', ['get', 'type'], 'city', 15, 'town', 13, 'suburb', 12, 11],
          'text-max-width': 8,
          'symbol-sort-key': ['match', ['get', 'type'], 'city', 1, 'town', 2, 'suburb', 3, 'village', 4, 5],
        },
        paint: { 'text-color': '#5a6b78', 'text-halo-color': '#fff', 'text-halo-width': 1.6 },
      },
      {
        id: 'bridges', type: 'symbol', source: 'canal', 'source-layer': 'features', minzoom: 13,
        filter: ['==', ['get', 'type'], 'bridge'],
        layout: { 'text-field': ['get', 'ref'], 'text-font': ['OpenSans-Regular'], 'text-size': 11 },
        paint: { 'text-color': '#5d4037', 'text-halo-color': '#fff', 'text-halo-width': 1.6 },
      },
    ],
  },
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'imperial' }), 'bottom-left');
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

// Satellite toggle.
const satBtn = document.getElementById('sat');
satBtn.addEventListener('click', () => {
  const on = map.getLayoutProperty('satellite', 'visibility') !== 'visible';
  map.setLayoutProperty('satellite', 'visibility', on ? 'visible' : 'none');
  satBtn.classList.toggle('on', on);
});

map.on('load', async () => {
  // Register the marker icons (needs the Material Icons webfont to be ready so
  // the glyphs draw, not tofu). Then add the facility + stoppage symbol layers.
  try { await document.fonts.load('88px "Material Icons"'); await document.fonts.ready; } catch (e) {}

  for (const k in POI) map.addImage('poi_' + k, markerImage(POI[k][2], POI[k][1]), { pixelRatio: 2 });
  map.addImage('poi_default', markerImage('place', '#555'), { pixelRatio: 2 });
  for (const s in STOP) map.addImage('stop_' + s, markerImage('warning', STOP[s]), { pixelRatio: 2 });

  const iconMatch = ['match', ['get', 'type']];
  for (const k in POI) iconMatch.push(k, 'poi_' + k);
  iconMatch.push('poi_default');

  // Facilities as icons, decluttered by collision (icon-allow-overlap: false) —
  // just like the app, so dense areas thin out instead of blobbing.
  map.addLayer({
    id: 'features', type: 'symbol', source: 'canal', 'source-layer': 'features',
    filter: ['!=', ['get', 'type'], 'bridge'],
    layout: {
      'icon-image': iconMatch,
      'icon-size': ['interpolate', ['linear'], ['zoom'], 8, 0.5, 13, 0.8, 16, 1.05],
      'icon-allow-overlap': false,
      'text-field': ['step', ['zoom'], '', 14, ['get', 'name']],
      'text-font': ['OpenSans-Regular'], 'text-size': 11,
      'text-offset': [0, 1.3], 'text-anchor': 'top', 'text-optional': true,
    },
    paint: { 'text-color': '#37474f', 'text-halo-color': '#fff', 'text-halo-width': 1.4 },
  });

  // Empty route layers, filled in when a route is computed.
  const empty = { type: 'FeatureCollection', features: [] };
  map.addSource('route', { type: 'geojson', data: empty });
  map.addLayer({
    id: 'route-line', type: 'line', source: 'route',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#6a1b9a', 'line-width': 5, 'line-opacity': 0.85 },
  });
  map.addSource('route-ends', { type: 'geojson', data: empty });
  map.addLayer({
    id: 'route-ends', type: 'circle', source: 'route-ends',
    paint: {
      'circle-radius': 8,
      'circle-color': ['match', ['get', 'role'], 'start', '#2e7d32', 'end', '#c62828', '#000'],
      'circle-stroke-color': '#fff', 'circle-stroke-width': 2.5,
    },
  });

  map.on('click', 'features', (e) => {
    if (routeMode) return; // in route mode, clicks place start/end instead
    const p = e.features[0].properties;
    const meta = POI[p.type];
    const label = meta ? meta[0] : (p.type || 'Feature');
    const name = (p.name && p.name.trim()) ? p.name : ('Unnamed ' + label.toLowerCase());
    new maplibregl.Popup().setLngLat(e.lngLat)
      .setHTML(`<b>${escapeHtml(name)}</b>${escapeHtml(label)}`).addTo(map);
  });
  map.on('mouseenter', 'features', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'features', () => map.getCanvas().style.cursor = '');

  // Live stoppages overlay, drawn with the same warning icons as the app.
  fetch(STOPPAGES_URL).then(r => r.json()).then(doc => {
    const items = doc.stoppages || [];
    const feats = items.filter(s => s.lat && s.lon).map(s => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [s.lon, s.lat] },
      properties: s,
    }));
    map.addSource('stoppages', { type: 'geojson', data: { type: 'FeatureCollection', features: feats } });
    map.addLayer({
      id: 'stoppages', type: 'symbol', source: 'stoppages',
      layout: {
        'icon-image': ['match', ['get', 'state'], 'restricted', 'stop_restricted', 'advisory', 'stop_advisory', 'stop_closed'],
        'icon-size': ['interpolate', ['linear'], ['zoom'], 8, 0.55, 13, 0.85, 16, 1.1],
        'icon-allow-overlap': true,
      },
    });
    map.on('click', 'stoppages', (e) => {
      if (routeMode) return;
      const p = e.features[0].properties;
      const dates = [p.start, p.end].filter(Boolean).join(' → ');
      new maplibregl.Popup().setLngLat(e.lngLat).setHTML(
        `<b>${escapeHtml(p.title || 'Notice')}</b>` +
        (p.waterway ? escapeHtml(p.waterway) + '<br>' : '') +
        (p.reason ? escapeHtml(p.reason) + '<br>' : '') +
        (dates ? '<small>' + escapeHtml(dates) + '</small>' : '')
      ).addTo(map);
    });
    map.on('mouseenter', 'stoppages', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'stoppages', () => map.getCanvas().style.cursor = '');
    const b = document.getElementById('banner');
    b.style.display = 'block';
    b.textContent = `⚠ ${feats.length} live stoppage${feats.length === 1 ? '' : 's'} & notices`;
  }).catch(() => {});
});

// Lightweight search over the bundled index.
let index = [];
fetch(SEARCH_URL).then(r => r.json()).then(d => { index = d; }).catch(() => {});
const q = document.getElementById('q');
const results = document.getElementById('results');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  results.innerHTML = '';
  if (!s) { results.style.display = 'none'; return; }
  const matches = index
    .filter(e => e.name.toLowerCase().includes(s))
    .sort((a, b) => (a.name.toLowerCase().startsWith(s) ? 0 : 1) - (b.name.toLowerCase().startsWith(s) ? 0 : 1))
    .slice(0, 20);
  for (const m of matches) {
    const li = document.createElement('li');
    const label = m.type === 'waterway' ? 'Waterway' : (POI[m.type] ? POI[m.type][0] : 'Feature');
    li.innerHTML = `${escapeHtml(m.name)} <small>· ${label}</small>`;
    li.onclick = () => {
      map.flyTo({ center: [m.lon, m.lat], zoom: 14 });
      results.style.display = 'none';
      q.value = m.name;
    };
    results.appendChild(li);
  }
  results.style.display = matches.length ? 'block' : 'none';
});

// ---------------------------------------------------------------------------
// Routing — a direct port of the app's on-device A* over the bundled graph
// (routing.graph). Same binary format, same lockmile ETA. £0: it all runs in
// the browser off the static file, no server.
// ---------------------------------------------------------------------------
const MPH_M_PER_MIN = 3 * 1609.34 / 60; // metres per minute at ~3 mph
const MINS_PER_LOCK = 10;
const R_EARTH = 6371000;

function haversine(la1, lo1, la2, lo2) {
  const p1 = la1 * Math.PI / 180, p2 = la2 * Math.PI / 180;
  const dp = (la2 - la1) * Math.PI / 180, dl = (lo2 - lo1) * Math.PI / 180;
  const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return R_EARTH * 2 * Math.asin(Math.min(1, Math.sqrt(a)));
}

function parseGraph(buf) {
  const dv = new DataView(buf);
  if (dv.getUint8(0) !== 0x43 || dv.getUint8(1) !== 0x4D ||
      dv.getUint8(2) !== 0x52 || dv.getUint8(3) !== 0x47) throw new Error('bad magic');
  let off = 5; // 4 magic + 1 version
  const n = dv.getUint32(off, true); off += 4;
  const lon = new Float32Array(n), lat = new Float32Array(n);
  for (let i = 0; i < n; i++) { lon[i] = dv.getFloat32(off, true); lat[i] = dv.getFloat32(off + 4, true); off += 8; }
  const isLock = new Uint8Array(n);
  const lockCount = dv.getUint32(off, true); off += 4;
  for (let i = 0; i < lockCount; i++) { isLock[dv.getUint32(off, true)] = 1; off += 4; }
  const edgeCount = dv.getUint32(off, true); off += 4;
  const ea = new Int32Array(edgeCount), eb = new Int32Array(edgeCount), deg = new Int32Array(n);
  for (let i = 0; i < edgeCount; i++) {
    const a = dv.getUint32(off, true), b = dv.getUint32(off + 4, true); off += 8;
    ea[i] = a; eb[i] = b; deg[a]++; deg[b]++;
  }
  const offsets = new Int32Array(n + 1);
  for (let i = 0; i < n; i++) offsets[i + 1] = offsets[i] + deg[i];
  const nbr = new Int32Array(edgeCount * 2);
  const cursor = offsets.slice(0, n);
  for (let i = 0; i < edgeCount; i++) {
    const a = ea[i], b = eb[i];
    nbr[cursor[a]++] = b; nbr[cursor[b]++] = a;
  }
  return { n, lon, lat, isLock, offsets, nbr };
}

function nearestNode(g, lng, lat) {
  let best = -1, bestD = Infinity;
  for (let i = 0; i < g.n; i++) {
    const dl = g.lon[i] - lng, da = g.lat[i] - lat;
    const d = dl * dl + da * da;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

// Binary min-heap (parallel arrays), keyed by priority.
function makeHeap() {
  const pri = [], val = [];
  const swap = (i, j) => { [pri[i], pri[j]] = [pri[j], pri[i]]; [val[i], val[j]] = [val[j], val[i]]; };
  return {
    empty: () => val.length === 0,
    push(p, v) {
      pri.push(p); val.push(v);
      let i = val.length - 1;
      while (i > 0) { const par = (i - 1) >> 1; if (pri[par] <= pri[i]) break; swap(i, par); i = par; }
    },
    pop() {
      const top = val[0]; const lp = pri.pop(), lv = val.pop();
      if (val.length) {
        pri[0] = lp; val[0] = lv; let i = 0; const m = val.length;
        for (;;) {
          const l = 2 * i + 1, r = 2 * i + 2; let s = i;
          if (l < m && pri[l] < pri[s]) s = l;
          if (r < m && pri[r] < pri[s]) s = r;
          if (s === i) break; swap(i, s); i = s;
        }
      }
      return top;
    },
  };
}

function computeRoute(g, fromLL, toLL) {
  const start = nearestNode(g, fromLL[0], fromLL[1]);
  const goal = nearestNode(g, toLL[0], toLL[1]);
  if (start < 0 || goal < 0) return null;
  const n = g.n;
  const gScore = new Float64Array(n).fill(Infinity);
  const came = new Int32Array(n).fill(-1);
  gScore[start] = 0;
  const h = (a) => haversine(g.lat[a], g.lon[a], g.lat[goal], g.lon[goal]);
  const open = makeHeap();
  open.push(h(start), start);
  while (!open.empty()) {
    const u = open.pop();
    if (u === goal) break;
    const gu = gScore[u];
    for (let e = g.offsets[u]; e < g.offsets[u + 1]; e++) {
      const v = g.nbr[e];
      const ng = gu + haversine(g.lat[u], g.lon[u], g.lat[v], g.lon[v]);
      if (ng < gScore[v]) { gScore[v] = ng; came[v] = u; open.push(ng + h(v), v); }
    }
  }
  if (came[goal] < 0 && start !== goal) return null;
  const path = [];
  for (let cur = goal; cur !== -1; cur = came[cur]) { path.push(cur); if (cur === start) break; }
  path.reverse();
  const coords = []; let locks = 0;
  for (let i = 0; i < path.length; i++) {
    coords.push([g.lon[path[i]], g.lat[path[i]]]);
    if (g.isLock[path[i]] && i !== 0 && i !== path.length - 1) locks++;
  }
  const metres = gScore[goal];
  const mins = Math.round(metres / MPH_M_PER_MIN + locks * MINS_PER_LOCK);
  return { coords, metres, locks, mins };
}

function fmtEta(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function routeGpx(r) {
  const day = new Date().toISOString().slice(0, 10);
  let s = '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<gpx version="1.1" creator="Canal Map: UK Waterways" xmlns="http://www.topografix.com/GPX/1/1">\n' +
    `  <metadata><name>Canal Map route — ${day}</name>` +
    `<desc>${(r.metres / 1609.34).toFixed(1)} miles, ${r.locks} locks.</desc></metadata>\n` +
    `  <trk><name>Canal Map route — ${day}</name><trkseg>\n`;
  for (const c of r.coords) s += `    <trkpt lat="${c[1].toFixed(6)}" lon="${c[0].toFixed(6)}"></trkpt>\n`;
  s += '  </trkseg></trk>\n</gpx>\n';
  return s;
}

// Waterways traversed + facilities passed (from the bundled search index), each
// with along-route mileage — powers the printable plan. Mirrors the app.
function routeItinerary(r) {
  const poly = r.coords; // [lon,lat]
  if (poly.length < 2 || !index.length) return { waterways: [], facilities: [] };
  const cum = [0];
  for (let i = 1; i < poly.length; i++)
    cum[i] = cum[i - 1] + haversine(poly[i - 1][1], poly[i - 1][0], poly[i][1], poly[i][0]);
  let minLa = 90, maxLa = -90, minLo = 180, maxLo = -180;
  for (const p of poly) {
    minLa = Math.min(minLa, p[1]); maxLa = Math.max(maxLa, p[1]);
    minLo = Math.min(minLo, p[0]); maxLo = Math.max(maxLo, p[0]);
  }
  const step = Math.max(1, Math.ceil(poly.length / 600));
  const margin = 0.01, thr = 250, hits = [];
  for (const e of index) {
    if (e.lat < minLa - margin || e.lat > maxLa + margin ||
        e.lon < minLo - margin || e.lon > maxLo + margin) continue;
    let best = Infinity, bi = 0;
    for (let i = 0; i < poly.length; i += step) {
      const d = haversine(e.lat, e.lon, poly[i][1], poly[i][0]);
      if (d < best) { best = d; bi = i; }
    }
    if (best <= thr) hits.push({ e, miles: cum[bi] / 1609.34 });
  }
  hits.sort((a, b) => a.miles - b.miles);
  const waterways = [];
  for (const h of hits) if (h.e.type === 'waterway') {
    if (!waterways.length || waterways[waterways.length - 1] !== h.e.name) waterways.push(h.e.name);
  }
  const facilities = hits.filter(h => POI[h.e.type]);
  return { waterways, facilities };
}

// A branded, print-friendly itinerary (browser Print → Save as PDF; £0, no lib).
function planHtml(r, hpd) {
  const totalMiles = r.metres / 1609.34, totalMins = r.mins, perDay = hpd * 60;
  const days = Math.max(1, Math.ceil(totalMins / perDay));
  const it = routeItinerary(r);
  const dayOf = (miles) =>
    Math.min(days, Math.floor(((miles / totalMiles) * totalMins) / perDay) + 1);
  const today = new Date().toLocaleDateString('en-GB',
    { day: 'numeric', month: 'long', year: 'numeric' });
  let rows = '', cur = 0;
  for (const f of it.facilities) {
    const d = dayOf(f.miles);
    if (d !== cur) {
      cur = d;
      const end = Math.min(totalMiles, (cur * perDay / totalMins) * totalMiles);
      rows += `<tr class="day"><td colspan="3">Day ${d} — to about ${end.toFixed(1)} mi</td></tr>`;
    }
    rows += `<tr><td class="mi">${f.miles.toFixed(1)}</td>` +
      `<td>${escapeHtml(POI[f.e.type][0])}</td><td>${escapeHtml(f.e.name || '')}</td></tr>`;
  }
  if (!rows) rows = `<tr><td colspan="3" class="muted">No mapped facilities within 250 m of this route.</td></tr>`;
  const wlist = it.waterways.length ? it.waterways.map(escapeHtml).join(' &rarr; ') : '—';
  return `<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Canal Map route plan</title><style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1f2a28;margin:0;padding:32px;line-height:1.5;}
  .head{display:flex;align-items:center;gap:10px;border-bottom:3px solid #16302b;padding-bottom:10px;}
  .head .mk{color:#d9a62a;font-size:26px;}.head b{font-size:20px;}.head span{color:#667;font-size:13px;}
  .meta{color:#667;font-size:13px;margin:10px 0 18px;}
  .summary{background:#f4f7f6;border-left:4px solid #16302b;border-radius:6px;padding:12px 14px;font-size:15px;}
  .summary b{font-size:17px;}
  h2{color:#16302b;margin:22px 0 6px;font-size:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  td{padding:5px 8px;border-bottom:1px solid #eee;vertical-align:top;}
  td.mi{white-space:nowrap;color:#667;width:60px;}
  tr.day td{background:#16302b;color:#fff;font-weight:600;border:0;}
  .muted{color:#889;}
  footer{margin-top:22px;color:#889;font-size:12px;border-top:1px solid #eee;padding-top:10px;}
  @media print{body{padding:0;}}
</style></head><body>
  <div class="head"><span class="mk">&#9875;</span><div><b>Canal Map</b> <span>UK WATERWAYS · route plan</span></div></div>
  <div class="meta">Produced ${today} by Canal Map: UK Waterways. Distances, lock counts and times are estimates — always check current notices and conditions before setting off.</div>
  <div class="summary"><b>${totalMiles.toFixed(1)} miles</b> · <b>${r.locks} locks</b> · about <b>${fmtEta(totalMins)}</b> cruising — roughly <b>${days} day${days === 1 ? '' : 's'}</b> at ${hpd} hours/day.</div>
  <h2>Waterways</h2><p>${wlist}</p>
  <h2>Along the way</h2>
  <table><tbody>${rows}</tbody></table>
  <footer>Contains data from OpenStreetMap contributors (ODbL), the Canal &amp; River Trust and the Environment Agency, under their respective open licences. Generated with Canal Map: UK Waterways — free, offline-first canal mapping.</footer>
</body></html>`;
}

function printPlan(r) {
  const el = document.getElementById('hpd');
  const hpd = Math.min(14, Math.max(1, parseInt((el && el.value) || '6', 10) || 6));
  const w = window.open('', '_blank');
  if (!w) { alert('Please allow pop-ups to download the plan.'); return; }
  w.document.write(planHtml(r, hpd));
  w.document.close();
  w.focus();
  setTimeout(() => { w.print(); }, 500);
}

// ---- Route-mode UI ----
let graph = null, graphLoading = false, routeMode = false, rStart = null, rEnd = null, lastRoute = null;
const rpanel = document.getElementById('rpanel');
const routeBtn = document.getElementById('route');

routeBtn.addEventListener('click', async () => {
  routeMode = !routeMode;
  routeBtn.classList.toggle('on', routeMode);
  document.body.classList.toggle('routing', routeMode); // hides search on phones
  map.getCanvas().style.cursor = routeMode ? 'crosshair' : '';
  if (routeMode) {
    rStart = rEnd = null; lastRoute = null; clearRoute();
    if (!graph && !graphLoading) await loadGraph();
    if (graph) prompt('Click a start point, then a destination.');
  } else {
    rStart = rEnd = null; clearRoute(); rpanel.classList.remove('show');
  }
});

async function loadGraph() {
  graphLoading = true;
  panel(`<span class="msg">Loading routing data…</span>`);
  try {
    const buf = await (await fetch('routing.graph')).arrayBuffer();
    graph = parseGraph(buf);
  } catch (e) {
    panel(`<span class="err">Could not load routing data.</span>`);
  }
  graphLoading = false;
}

function panel(html) { rpanel.innerHTML = html; rpanel.classList.add('show'); }
function prompt(msg) { panel(`<span class="msg">${msg}</span><button class="ghost" id="rx">Clear</button>`); wire(); }
function wire() {
  const x = document.getElementById('rx');
  if (x) x.onclick = () => { rStart = rEnd = null; lastRoute = null; clearRoute(); if (routeMode) prompt('Click a start point, then a destination.'); };
  const dl = document.getElementById('rdl');
  if (dl && lastRoute) {
    const blob = new Blob([routeGpx(lastRoute)], { type: 'application/gpx+xml' });
    dl.href = URL.createObjectURL(blob);
    dl.download = `canal-map-route-${new Date().toISOString().slice(0, 10)}.gpx`;
  }
  const pl = document.getElementById('rplan');
  if (pl && lastRoute) pl.onclick = () => printPlan(lastRoute);
}

function clearRoute() {
  if (!map.getSource('route')) return;
  const empty = { type: 'FeatureCollection', features: [] };
  map.getSource('route').setData(empty);
  map.getSource('route-ends').setData(empty);
}

function drawEnds() {
  const feats = [];
  if (rStart) feats.push({ type: 'Feature', geometry: { type: 'Point', coordinates: rStart }, properties: { role: 'start' } });
  if (rEnd) feats.push({ type: 'Feature', geometry: { type: 'Point', coordinates: rEnd }, properties: { role: 'end' } });
  map.getSource('route-ends').setData({ type: 'FeatureCollection', features: feats });
}

map.on('click', (e) => {
  if (!routeMode || !graph) return;
  const ll = [e.lngLat.lng, e.lngLat.lat];
  if (!rStart || lastRoute) { rStart = ll; rEnd = null; lastRoute = null; clearRoute(); drawEnds(); prompt('Now click a destination.'); return; }
  rEnd = ll; drawEnds();
  panel(`<span class="msg">Finding route…</span>`);
  // Let the panel paint before the (sync) A* runs.
  setTimeout(() => {
    const r = computeRoute(graph, rStart, rEnd);
    if (!r) {
      panel(`<span class="err">No through route by water — the points are on separately-mapped waterways.</span>` +
        `<button class="ghost" id="rx">Clear</button>`); wire(); return;
    }
    lastRoute = r;
    map.getSource('route').setData({
      type: 'FeatureCollection',
      features: [{ type: 'Feature', geometry: { type: 'LineString', coordinates: r.coords } }],
    });
    panel(
      `<span class="stat"><b>${(r.metres / 1609.34).toFixed(1)}</b><span>mi</span></span>` +
      `<span class="stat"><b>${r.locks}</b><span>locks</span></span>` +
      `<span class="stat"><b>${fmtEta(r.mins)}</b><span>approx</span></span>` +
      `<label class="hpd">hrs/day <input id="hpd" type="number" min="1" max="14" value="6"></label>` +
      `<button id="rplan">Plan (PDF)</button>` +
      `<a class="dl" id="rdl">GPX</a>` +
      `<button class="ghost" id="rx">Clear</button>`);
    wire();
  }, 20);
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
